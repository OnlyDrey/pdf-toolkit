name: CI
on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact commit to validate (release callers must supply this)
        type: string
        required: false
        default: ''
      require_full_validation:
        description: Always run container and browser checks for release validation
        type: boolean
        required: false
        default: false
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [work, main, develop, 'feat/**', 'fix/**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:run
      - run: npm run test:release --if-present
      - run: npm run build
      - run: npm audit --audit-level=high
  release-engine:
    name: Release engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # Test the immutable release policy even when validating an older application SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: release-policy
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s release-policy/app/scripts -p test_release.py
      - name: Check Bash launcher
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n release-policy/app/scripts/release.sh
          release-policy/app/scripts/release.sh build --dry-run --non-interactive
      - name: Check Windows PowerShell 5.1 launcher
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & .\release-policy\app\scripts\release.ps1 build --dry-run --non-interactive
          exit $LASTEXITCODE
  container:
    # Bot PRs get code validation immediately; a maintainer label enables expensive checks.
    # Release callers always force the full suite on the selected commit.
    if: inputs.require_full_validation || github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' || contains(github.event.pull_request.labels.*.name, 'dependencies:validate')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./app
          load: true
          push: false
          tags: pdf-toolkit:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker compose -f ../compose.yaml config --quiet
      - run: docker compose -f compose.local.yaml config --quiet
      - run: scripts/test-container.sh
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: pdf-toolkit:verify
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser regression against production Nginx
        run: |
          docker run -d --name browser-test --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m,uid=101,gid=101 --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:4180:8080 pdf-toolkit:verify
          TEST_BASE_URL=http://127.0.0.1:4180 npm run test:e2e
      - run: docker rm -f browser-test
        if: always()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          archive: true
          name: browser-test-results
          path: app/test-results/
  ready:
    # Require this aggregate check in branch protection: a skipped expensive job is not approval.
    if: always()
    needs: [validate, release-engine, container]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require successful code, container and browser validation
        env:
          CODE_RESULT: ${{ needs.validate.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          ENGINE_RESULT: ${{ needs.release-engine.result }}
        run: |
          if [ "$CODE_RESULT" != success ] || [ "$CONTAINER_RESULT" != success ] || [ "$ENGINE_RESULT" != success ]; then
            echo 'Full validation is required. For Dependabot PRs, a maintainer must apply dependencies:validate.' >&2
            exit 1
          fi
