name: CI
on:
  workflow_call:
  pull_request:
  push:
    branches: [work, main, develop, 'feat/**', 'fix/**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:run
      - run: npm run build
      - run: npm audit --audit-level=high
  container:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./app
          load: true
          push: false
          tags: pdf-toolkit:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker compose -f ../compose.yaml config --quiet
      - run: docker compose -f compose.local.yaml config --quiet
      - run: scripts/test-container.sh
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: pdf-toolkit:verify
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser regression against production Nginx
        run: |
          docker run -d --name browser-test --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m,uid=101,gid=101 --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:4180:8080 pdf-toolkit:verify
          TEST_BASE_URL=http://127.0.0.1:4180 npm run test:e2e
      - run: docker rm -f browser-test
        if: always()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-test-results
          path: app/test-results/
